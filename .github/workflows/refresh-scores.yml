name: Refresh match scores
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Sync fixtures (scores + événements)
        run: |
          curl -sf --max-time 290 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://bootroom.online/api/cron/sync-fixtures
      - name: Process scoring
        run: |
          curl -sf --max-time 290 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://bootroom.online/api/cron/process-scoring

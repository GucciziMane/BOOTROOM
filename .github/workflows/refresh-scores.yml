name: Refresh match scores
on:
  # Re-réactivé le 23/09/2026 en SECOURS (pas en remplacement de QStash) : deux pannes silencieuses
  # confirmées du schedule QStash lui-même (scripts/setup-qstash-schedules.mjs), pas de nos crons —
  # le 19/09 (~2h de trou), et le 20/09 18h30-00h00 UTC, cette fois vérifié directement via l'API
  # QStash (GET /v2/events) : zéro évènement "CREATED" sur toute la fenêtre, donc le planificateur
  # QStash n'a même pas tenté de livrer, ce n'est pas un échec réseau/retry de notre côté. On ne
  # contrôle pas la fiabilité de leur planificateur, donc ce filet indépendant reprend le relais si
  # ça se reproduit — son imprécision documentée ci-dessous (3h35 en moyenne) n'est plus un problème
  # ici puisqu'il ne sert plus de seule source, juste à borner une panne QStash prolongée.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Sync fixtures (scores + événements)
        run: |
          curl -sf --max-time 270 --retry 2 --retry-delay 5 --retry-connrefused -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://bootroom.online/api/cron/sync-fixtures
      # Toujours lancé, même si le sync a échoué ou a expiré au-dessus : sinon un simple accroc
      # réseau sur le sync (ça arrive, ~13% des runs) empêche aussi de distribuer les points des
      # matchs déjà marqués "finished" lors d'un run précédent — les deux étapes sont indépendantes.
      - name: Process scoring
        if: always()
        run: |
          curl -sf --max-time 270 --retry 2 --retry-delay 5 --retry-connrefused -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://bootroom.online/api/cron/process-scoring

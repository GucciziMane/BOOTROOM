name: Refresh match scores
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Sync fixtures (scores + événements)
        run: |
          curl -sf --max-time 270 --retry 2 --retry-delay 5 --retry-connrefused -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://bootroom.online/api/cron/sync-fixtures
      # Toujours lancé, même si le sync a échoué ou a expiré au-dessus : sinon un simple accroc
      # réseau sur le sync (ça arrive, ~13% des runs) empêche aussi de distribuer les points des
      # matchs déjà marqués "finished" lors d'un run précédent — les deux étapes sont indépendantes.
      - name: Process scoring
        if: always()
        run: |
          curl -sf --max-time 270 --retry 2 --retry-delay 5 --retry-connrefused -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://bootroom.online/api/cron/process-scoring
